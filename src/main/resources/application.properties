spring.application.name=payments-ledger-api

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB connection open while the HTTP response is written.
spring.jpa.open-in-view=false

# Return errors as RFC 9457 "problem details" JSON.
spring.mvc.problemdetails.enabled=true
